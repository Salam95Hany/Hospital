<div class="login-container">
    <div class="medical-pattern"></div>
    <div class="login-wrapper">
        <div class="logo-section">
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fas fa-hospital logo-icon"></i>
                </div>
            </div>
            <h1 class="hospital-name">Hospital</h1>
            <p class="hospital-tagline">Urology Department</p>
        </div>
        <form class="login-form" #LoginForm="ngForm">
            <div class="form-group">
                <div class="input-container">
                    <i class="fas fa-user input-icon user-icon"></i>
                    <input type="text" class="form-input" name="UserName" #UserName="ngModel" [(ngModel)]="LoginModel.userName" placeholder="User Name...." required />
                </div>
                <div class="error-message show" *ngIf="UserName.invalid && (UserName.dirty || UserName.touched || LoginForm.submitted )">
                    <i class="fas fa-exclamation-circle"></i>
                    <span *ngIf="UserName.errors?.required">User Name Required  </span>
                </div>
            </div>
            <div class="form-group">
                <div class="input-container">
                    <i class="fas fa-lock input-icon lock-icon" (click)="togglePassword()"></i>
                    <input [type]="showPassword ? 'text' : 'password'" class="form-input" name="Password" #Password="ngModel" [(ngModel)]="LoginModel.password" placeholder="Password" required />
                </div>
                <div class="error-message show" *ngIf="Password.invalid && (Password.dirty || Password.touched || LoginForm.submitted )">
                    <i class="fas fa-exclamation-circle"></i>
                    <span *ngIf="Password.errors?.required">  User Name Required</span>
                </div>
            </div>
            <div class="form-group" *ngIf="ErrorMessage">
                <div class="error-message show mb-2">
                    <i class="fas fa-times-circle"></i>
                    <span>{{ ErrorMessage }}</span>
                </div>
            </div>
            <button class="login-button" [disabled]="loading" (click)="Login()">
                <div class="button-content" *ngIf="!loading">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Login </span>
                </div>
                <div *ngIf="loading" class="button-content">
                    <div class="button-spinner"></div>
                    <span>Login ...</span>
                </div>
            </button>
        </form>
        <div class="login-footer">
            <p class="footer-text">
                <i class="fas fa-shield-alt footer-icon"></i> Your credentials are safe with us.
            </p>
        </div>
    </div>
</div>
