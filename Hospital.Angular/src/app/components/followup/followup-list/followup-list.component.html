<app-admin-breadcrumb [Title]="'Follow Up'"></app-admin-breadcrumb>

<div class="patients-container mb-2">
    <div class="search-filter-container">
        <div class="row">
            <div class="col-md-4">
                <app-search-autocomplete (itemSearch)="onPatientSelected($event)"></app-search-autocomplete>
            </div>
            <div class="col-md-4">
                <app-search-autocomplete [mainTitle]="'Select Admission'" [inputPlaceholder]="'Enter Admission'" [searchDescripition]="'Start typing to search admission'" [searchType]="'Admission'" [itemId]="selectedPatient?.id" [selectedItem]="selectedAdmission" [disabled]="!selectedPatient"
                    (itemSearch)="onAdmissionSelected($event)"></app-search-autocomplete>
            </div>
            <div class="col-md-4">
                <app-search-autocomplete [mainTitle]="'Select Surgical Interventions'" [inputPlaceholder]="'Enter Surgical Interventions'" [searchDescripition]="'Start typing to search surgical interventions'" [searchType]="'SurgicalInterventions'" [itemId]="selectedAdmission?.id"
                    [selectedItem]="selectedSurgicalInterventions" [disabled]="!selectedAdmission" (itemSearch)="onSurgicalInterventionsSelected($event)"></app-search-autocomplete>
            </div>
        </div>
    </div>
</div>
<div class="patients-container">
    <div class="patients-header">
        <div class="d-flex align-items-center flex-wrap gap-2">
            <button class="btn btn-primary add-patient-btn" (click)="OpenFollowUpCreateModal(FollowUpCreateModal,null)">
                <i class="fas fa-plus-circle"></i> Add Follow Up
            </button>
            <button class="btn btn-primary add-patient-btn" (click)="isFilter = !isFilter" [attr.aria-expanded]="!isFilter">
                <i class="fas fa-filter"></i> {{ isFilter ? 'Show' : 'Hide' }} Filters
            </button>
        </div>
        <div>
            <app-admin-pagination [currentPage]="1" [pageSize]="20" [totalPages]="0" [totalCount]="TotalCount"></app-admin-pagination>
        </div>
    </div>
    <div class="px-3 py-2 bg-light border-bottom" #collapse="ngbCollapse" [(ngbCollapse)]="isFilter">
        <app-admin-filter [FilterList]="FilterList" (FilterChecked)="OnFilterChecked($event)"></app-admin-filter>
    </div>

    <div class="patients-table-container">
        <table class="table patients-table">
            <thead>
                <tr>
                    <th>Patient Name</th>
                    <th>FollowUp Date</th>
                    <th>Created By</th>
                    <th>Added Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of FollowUps">
                    <td>{{ item.patientName }}</td>
                    <td>{{ item.followUpDate | date }}</td>
                    <td>{{ item.createdBy }}</td>
                    <td>{{ item.createdDate | date }}</td>
                    <td class="actions-cell">
                        <button class="btn btn-sm btn-info" (click)="OpenFollowUpDetailsModal(FollowUpDetailsModal,item.followUpId)">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-warning" (click)="OpenFollowUpCreateModal(FollowUpCreateModal,item.followUpId)">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="openDeleteItemModal(deleteItemModal,item.followUpId)">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr *ngIf="FollowUps.length === 0">
                    <td colspan="7" class="text-center">No Data Found</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>


<ng-template #FollowUpCreateModal let-modal>
    <app-followup-create [FollowUpId]="FollowUpId" [SurgicalInterventionId]="SurgicalInterventionId"></app-followup-create>
</ng-template>

<ng-template #FollowUpDetailsModal let-modal>
    <div class="modal-header modal-header-bg justify-content-between">
        <h2 class="d-flex align-items-center gap-2">
            <i class="fas fa-file-alt"></i>
            <span>Follow-Up Details</span>
        </h2>
        <div class="cursor-pointer text-danger fs-2" (click)="modal.dismiss()">
            <i class="fas fa-times-circle"></i>
        </div>
    </div>
    <div class="modal-body">
        <div class="step-content form-card" style="display: block;">
            <div class="row g-3">
                <app-admin-general-input [type]="'date'" [placeholder]="'Follow-up Date'" [label]="'Follow-up Date'" [valueBind]="FollowUpObj?.followUpDate ?? ''" [disabled]="true" class="col-md-4">
                </app-admin-general-input>

                <app-admin-general-input [type]="'text'" [placeholder]="'Patient Remarks'" [label]="'Patient Remarks'" [valueBind]="FollowUpObj?.patientRemarksStatus ?? ''" [disabled]="true" class="col-md-4">
                </app-admin-general-input>

                <app-admin-general-input [type]="'text'" [placeholder]="'Wound Status'" [label]="'Wound Status'" [valueBind]="FollowUpObj?.woundStatus ?? ''" [disabled]="true" class="col-md-4">
                </app-admin-general-input>

                <app-admin-general-input [type]="'text'" [placeholder]="'Catheters'" [label]="'Catheters'" [valueBind]="FollowUpObj?.catheters ?? ''" [disabled]="true" class="col-md-4">
                </app-admin-general-input>

                <app-admin-general-input [type]="'text'" [placeholder]="'Image Path'" [label]="'Image Path'" [valueBind]="FollowUpObj?.imagePath ?? ''" [disabled]="true" class="col-md-4">
                </app-admin-general-input>

                <app-admin-general-input [type]="'date'" [placeholder]="'Next Follow-up Date'" [label]="'Next Follow-up Date'" [valueBind]="FollowUpObj?.nextFollowUpDate ?? ''" [disabled]="true" class="col-md-4">
                </app-admin-general-input>

                <app-admin-general-input [type]="'textarea'" [placeholder]="'Details of Patient Remarks'" [label]="'Details of Patient Remarks'" [valueBind]="FollowUpObj?.patientRemarksDetails ?? ''" [disabled]="true" class="col-md-12">
                </app-admin-general-input>

                <app-admin-general-input [type]="'textarea'" [placeholder]="'Examination Findings'" [label]="'Examination Findings'" [valueBind]="FollowUpObj?.examinationFindings ?? ''" [disabled]="true" class="col-md-12">
                </app-admin-general-input>

                <app-admin-general-input [type]="'textarea'" [placeholder]="'Lab Results'" [label]="'Lab Results'" [valueBind]="FollowUpObj?.labResults ?? ''" [disabled]="true" class="col-md-12">
                </app-admin-general-input>

                <app-admin-general-input [type]="'textarea'" [placeholder]="'Imaging Results'" [label]="'Imaging Results'" [valueBind]="FollowUpObj?.imagingResults ?? ''" [disabled]="true" class="col-md-12">
                </app-admin-general-input>

                <app-admin-general-input [type]="'textarea'" [placeholder]="'Advice'" [label]="'Advice'" [valueBind]="FollowUpObj?.advice ?? ''" [disabled]="true" class="col-md-12">
                </app-admin-general-input>

                <app-admin-general-input [type]="'textarea'" [placeholder]="'New Decision'" [label]="'New Decision'" [valueBind]="FollowUpObj?.newDecision ?? ''" [disabled]="true" class="col-md-12">
                </app-admin-general-input>
            </div>
        </div>
    </div>
</ng-template>

<ng-template #deleteItemModal let-modal>
    <div class="modal-header modal-header-bg justify-content-between">
        <h2 class="d-flex align-items-center gap-2">
            <span>Confirm Action</span>
        </h2>
        <div class="cursor-pointer text-danger fs-2" (click)="modal.dismiss()">
            <i class="fas fa-times-circle"></i>
        </div>
    </div>
    <div class="modal-body">
        <p class="fs-5 m-0">Are you sure you want to remove this item?</p>
    </div>
    <div class="modal-footer justify-content-start">
        <button type="button" class="btn btn-success" (click)="DeleteItem()">
            <i class="fas fa-check"></i>
            <span class="me-2">Yes</span>
        </button>
        <button type="button" class="btn btn-danger" (click)="modal.close('Save click')">
            <i class="fas fa-times"></i>
            <span class="me-2">No</span>
        </button>
    </div>
</ng-template>
