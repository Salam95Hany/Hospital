<div class="step-content form-card" data-step="1" style="display: block;">
    <h3 class="step-heading">
        <i class="fas fa-user"></i> Create Surgical Intervention
    </h3>
    <form [formGroup]="ItemForm" autocomplete="off">
        <div class="row g-3">
            <app-admin-general-input [type]="'date'" [placeholder]="'Date of Intervention'" [label]="'Date of Intervention'" formControlName="interventionDate" [error]="formErrors.interventionDate" class="col-md-6">
            </app-admin-general-input>

            <app-admin-drop-down [data]="theatres" [placeholder]="'Select Theater'" [error]="formErrors.theater" [label]="'Theater'" formControlName="theater" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-general-input [type]="'text'" [placeholder]="'Main Surgeon'" [label]="'Main Surgeon'" formControlName="mainSurgeon" class="col-md-6">
            </app-admin-general-input>

            <app-admin-general-input [type]="'text'" [placeholder]="'Assistants'" [label]="'Assistants'" formControlName="assistants" class="col-md-6">
            </app-admin-general-input>

            <app-admin-general-input [type]="'text'" [placeholder]="'Resident'" [label]="'Resident'" formControlName="resident" class="col-md-6">
            </app-admin-general-input>

            <app-admin-general-input [type]="'text'" [placeholder]="'Off-Field Supervisor'" [label]="'Off-Field Supervisor'" formControlName="offFieldSupervisor" class="col-md-6">
            </app-admin-general-input>

            <app-admin-drop-down [data]="anaesthesias" [placeholder]="'Select Anesthesia'" [label]="'Anesthesia'" formControlName="anesthesia" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-general-input [type]="'textarea'" [placeholder]="'Intervention'" [label]="'Intervention'" formControlName="intervention" class="col-md-12">
            </app-admin-general-input>

            <app-admin-general-input [type]="'textarea'" [placeholder]="'Details of Intervention'" [label]="'Details of Intervention'" formControlName="interventionDetails" class="col-md-12">
            </app-admin-general-input>

            <app-admin-drop-down [data]="tubesFixed" [placeholder]="'Select Tubes Fixed'" [label]="'Tubes Fixed'" formControlName="tubesFixed" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-drop-down [data]="categories" [placeholder]="'Select Category'" [label]="'Category'" formControlName="category" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-drop-down [data]="approaches" [placeholder]="'Select Approach'" [label]="'Approach'" formControlName="approach" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-drop-down [data]="organs" [placeholder]="'Select Organ'" [label]="'Organ'" formControlName="organ" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-drop-down [data]="intraOpCourses" [placeholder]="'Select Intra-operative Course'" [label]="'Intra-operative Course'" formControlName="intraOperativeCourse" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-general-input [type]="'text'" [placeholder]="'Blood Transfusion (Units)'" [label]="'Blood Transfusion (Units)'" formControlName="bloodTransfusionUnits" class="col-md-6">
            </app-admin-general-input>

            <app-admin-general-input [type]="'textarea'" [placeholder]="'Intra-op Adverse Events'" [label]="'Intra-op Adverse Events'" formControlName="intraOpAdverseEvents" class="col-md-12">
            </app-admin-general-input>

            <app-admin-general-input [type]="'textarea'" [placeholder]="'Post-op Recommendations'" [label]="'Post-op Recommendations'" formControlName="postOpRecommendations" class="col-md-12">
            </app-admin-general-input>

            <app-admin-drop-down [data]="postOpCourses" [placeholder]="'Select Post-op Course (Day 0-1)'" [label]="'Post-op Course (Day 0-1)'" formControlName="postOpDay0_1" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-drop-down [data]="postOpCourses" [placeholder]="'Select Post-op Course (Day 2-5)'" [label]="'Post-op Course (Day 2-5)'" formControlName="postOpDay2_5" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-drop-down [data]="postOpCourses" [placeholder]="'Select Post-op Course (Day >5)'" [label]="'Post-op Course (Day >5)'" formControlName="postOpDayOver5" class="col-md-6">
            </app-admin-drop-down>

            <app-admin-general-input [type]="'textarea'" [placeholder]="'Post-op Adverse Events'" [label]="'Post-op Adverse Events'" formControlName="postOpAdverseEvents" class="col-md-12">
            </app-admin-general-input>

            <app-admin-general-input [type]="'date'" [placeholder]="'Discharge Date'" [label]="'Discharge Date'" formControlName="dischargeDate" class="col-md-6">
            </app-admin-general-input>

            <app-admin-general-input [type]="'textarea'" [placeholder]="'Final Diagnosis'" [label]="'Final Diagnosis'" formControlName="finalDiagnosis" class="col-md-12">
            </app-admin-general-input>

            <app-admin-general-input [type]="'textarea'" [placeholder]="'Discharge Instructions'" [label]="'Discharge Instructions'" formControlName="dischargeInstructions" class="col-md-12">
            </app-admin-general-input>

            <app-admin-general-input [type]="'text'" [placeholder]="'Follow-up Doctor'" [label]="'Follow-up Doctor'" formControlName="followUpDoctor" class="col-md-6">
            </app-admin-general-input>

            <app-admin-general-input [type]="'text'" [placeholder]="'Follow-up Doctor Phone'" [label]="'Follow-up Doctor Phone'" formControlName="followUpDoctorPhone" class="col-md-6">
            </app-admin-general-input>

            <app-admin-general-input [type]="'date'" [placeholder]="'Follow-up Appointment'" [label]="'Follow-up Appointment'" formControlName="followUpAppointment" class="col-md-6">
            </app-admin-general-input>

            <button class="btn btn-success" (click)="AddNewItem()">
                <i class="fas fa-save"></i> Save
            </button>
        </div>
    </form>

</div>
