<app-admin-breadcrumb [Title]="'Surgical Intervention'"></app-admin-breadcrumb>

<div class="patients-container mb-2">
    <div class="search-filter-container">
        <div class="row">
            <div class="col-md-4">
                <app-search-autocomplete (itemSearch)="onPatientSelected($event)"></app-search-autocomplete>
            </div>
            <div class="col-md-4">
                <app-search-autocomplete [mainTitle]="'Select Admission'" [inputPlaceholder]="'Select Admission'" [searchDescripition]="'Start typing to search admission'" [searchType]="'Admission'" [itemId]="selectedPatient?.id" [selectedItem]="selectedAdmission" [disabled]="!selectedPatient"
                    (itemSearch)="onAdmissionSelected($event)"></app-search-autocomplete>
            </div>
        </div>
    </div>
</div>

<div class="patients-container">
    <div class="patients-header">
        <div class="d-flex align-items-center flex-wrap gap-2">
            <button class="btn btn-primary add-patient-btn" (click)="OpenSurgicalCreateModal(SurgicalCreateModal,null)" appRole [roles]="['SupperAdmin', 'Admin']">
                <i class="fas fa-plus-circle"></i> Add Surgical Intervention
            </button>
            <button class="btn btn-primary add-patient-btn" (click)="isFilter = !isFilter" [attr.aria-expanded]="!isFilter" *ngIf="SurgicalInterventions.length > 0">
                <i class="fas fa-filter"></i> {{ isFilter ? 'Show' : 'Hide' }} Filters
            </button>
        </div>
        <div>
            <app-admin-pagination (pageChanged)="OnPageChanged($event)" [currentPage]="PagingFilter.currentpage" [pageSize]="PagingFilter.pagesize" [totalPages]="0" [totalCount]="TotalCount"></app-admin-pagination>
        </div>
    </div>
    <div class="px-3 py-2 bg-light border-bottom" #collapse="ngbCollapse" [(ngbCollapse)]="isFilter">
        <app-admin-filter [FilterList]="FilterList" (FilterChecked)="OnFilterChecked($event)"></app-admin-filter>
    </div>

    <div class="patients-table-container">
        <table class="table patients-table">
            <thead>
                <tr>
                    <th>Intervention Date</th>
                    <th>Created By</th>
                    <th>Added Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of SurgicalInterventions">
                    <td>{{ item.interventionDate | date }}</td>
                    <td>{{ item.createdBy }}</td>
                    <td>{{ item.createdDate | date}}</td>
                    <td class="actions-cell">
                        <button class="btn btn-sm btn-info" (click)="OpenSurgicalDetailsModal(SurgicalDetailsModal,item.surgicalInterventionId)">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-warning" (click)="OpenSurgicalCreateModal(SurgicalCreateModal,item.surgicalInterventionId)" appEditExpire [appEditExpire]="item.createdDate" appRole [roles]="['SupperAdmin', 'Admin']">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-danger me-1" (click)="openDeleteItemModal(deleteItemModal,item.surgicalInterventionId)" appRole [roles]="['SupperAdmin', 'Admin']">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="btn btn-sm btn-success download-btn me-1" (click)="DownloadPdfFile(item.surgicalInterventionId,'InterventionReport')">
                            <i class="fas fa-download"></i>
                            <span class="me-1">Intervention Report</span>
                        </button>
                        <button class="btn btn-sm btn-success download-btn me-1" (click)="DownloadPdfFile(item.surgicalInterventionId,'DischargeSummary')">
                            <i class="fas fa-download"></i>
                            <span class="me-1">Discharge Summary</span>
                        </button>
                    </td>
                </tr>
                <tr *ngIf="SurgicalInterventions.length === 0">
                    <td colspan="7" class="text-center">No Data Found</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<ng-template #SurgicalCreateModal let-modal>
    <app-surgical-intervention-create (RefreshData)="RefreshData($event)" [AdmissionId]="AdmissionId" [SurgicalInterventionId]="SurgicalInterventionId" [DoctorsData]="DoctorsData"></app-surgical-intervention-create>
</ng-template>

<ng-template #SurgicalDetailsModal let-modal>
    <app-surgical-intervention-create (RefreshData)="RefreshData($event)" [AdmissionId]="AdmissionId" [SurgicalInterventionId]="SurgicalInterventionId" [DoctorsData]="DoctorsData" [DetailsMode]="true"></app-surgical-intervention-create>
</ng-template>

<ng-template #deleteItemModal let-modal>
    <div class="modal-header modal-header-bg justify-content-between">
        <h2 class="d-flex align-items-center gap-2">
            <span>Confirm Action</span>
        </h2>
        <div class="cursor-pointer text-danger fs-2" (click)="modal.dismiss()">
            <i class="fas fa-times-circle"></i>
        </div>
    </div>
    <div class="modal-body">
        <p class="fs-5 m-0">Are you sure you want to remove this item?</p>
    </div>
    <div class="modal-footer justify-content-start">
        <button type="button" class="btn btn-success" (click)="DeleteItem()" [disabled]="BtnDisabled">
            <i class="fas fa-check"></i>
            <span class="me-2">Yes</span>
        </button>
        <button type="button" class="btn btn-danger" (click)="modal.close('Save click')">
            <i class="fas fa-times"></i>
            <span class="me-2">No</span>
        </button>
    </div>
</ng-template>

<ngx-loading [show]="showLoader"></ngx-loading>
