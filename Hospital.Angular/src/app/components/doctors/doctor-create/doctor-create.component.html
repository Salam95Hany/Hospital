<div class="patient-create-container">
  <div class="patient-create-header">
    <h2 class="patient-create-title">{{ editingId ? 'تعديل بيانات الطبيب' : 'اضافة طبيب جديد' }}</h2>
  </div>

  <form [formGroup]="doctorForm" (ngSubmit)="saveDoctor()">
    <div class="row g-3 form-container">
      <div class="col-md-6">
        <label class="form-label">الاسم الكامل</label>
        <input formControlName="fullName" class="form-control" />
      </div>
      <div class="col-md-6">
        <label class="form-label">التخصص</label>
        <input formControlName="specialization" class="form-control" />
      </div>
      <div class="col-md-6">
        <label class="form-label">القسم</label>
        <input formControlName="department" class="form-control" />
      </div>
      <div class="col-md-6">
        <label class="form-label">الهاتف</label>
        <input formControlName="phoneNumber" class="form-control" />
      </div>
      <div class="col-md-6">
        <label class="form-label">البريد الإلكتروني</label>
        <input formControlName="email" class="form-control" />
      </div>
      <div class="col-md-6">
        <label class="form-label">رقم الترخيص</label>
        <input formControlName="licenseNumber" class="form-control" />
      </div>
      <div class="col-12">
        <label class="form-label">العنوان</label>
        <input formControlName="address" class="form-control" />
      </div>
    </div>

    <div class="form-navigation">
      <button type="submit" class="btn btn-success">حفظ</button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">إلغاء</button>
    </div>
  </form>
</div>
