<div class="patient-create-container" [class.readonly]="isReadOnly">
    <div class="patient-create-header d-flex justify-content-between align-items-center">
        <h2 class="patient-create-title mb-0">{{ isReadOnly ? 'Patient Details' : (isEditMode ? 'Edit Patient' : 'Add New Patient') }}</h2>
        <ng-container *ngIf="!isModal; else modalClose">
            <button class="btn btn-outline-secondary" (click)="navigateBack()">
            <i class="fas fa-arrow-left"></i> Back to List
          </button>
        </ng-container>
        <ng-template #modalClose>
            <!-- <button type="button" class="btn btn-outline-danger" (click)="closeModal()" aria-label="Close">
            <i class="fas fa-times"></i>
          </button> -->
            <div class="cursor-pointer text-danger fs-2" (click)="closeModal()" *ngIf="!isReadOnly">
                <i class="fas fa-times-circle"></i>
            </div>
        </ng-template>
    </div>

    <!-- Single-step: Patient Information only -->

    <!-- Form Steps -->
    <form [formGroup]="patientForm" (ngSubmit)="savePatient()">
        <!-- Patient Information -->
        <div class="step-content" formGroupName="patient">
            <h3 class="step-heading"><i class="fas fa-user text-primary"></i> Patient Information</h3>
            <div class="step-content-inner" [attr.tabindex]="isReadOnly ? -1 : null">
                <div class="row g-3">
                    <app-admin-general-input class="col-md-6" label="Name" placeholder="Enter name" formControlName="name" [error]="formErrors.name"></app-admin-general-input>
                    <app-admin-general-input class="col-md-6" type="date" label="Birth Date" formControlName="birthDate"></app-admin-general-input>
                    <app-admin-general-input class="col-md-6" type="number" label="Age" placeholder="Enter age" formControlName="age" [error]="formErrors.age"></app-admin-general-input>
                    <app-admin-drop-down class="col-md-6" label="Gender" [data]="[{id:'Male',name:'Male'}, {id:'Female',name:'Female'}]" placeholder="Select Gender" formControlName="gender" [error]="formErrors.gender"></app-admin-drop-down>
                    <app-admin-general-input class="col-md-6" label="National ID" placeholder="Enter National ID" formControlName="nationalId" [error]="formErrors.nationalId"></app-admin-general-input>
                    <app-admin-general-input class="col-md-6" label="Address" placeholder="Enter address" formControlName="address"></app-admin-general-input>
                    <app-admin-general-input class="col-md-6" label="Phone 1" placeholder="Enter phone 1" formControlName="phone1" [error]="formErrors.phone1"></app-admin-general-input>
                    <app-admin-general-input class="col-md-6" label="Phone 2" placeholder="Enter phone 2" formControlName="phone2" [error]="formErrors.phone2"></app-admin-general-input>
                    <app-admin-drop-down class="col-md-6" label="Governorate" [data]="governorates" placeholder="Select Governorate" formControlName="governorate"></app-admin-drop-down>
                    <app-admin-general-input class="col-md-6" label="Occupation" placeholder="Enter occupation" formControlName="occupation"></app-admin-general-input>
                    <app-admin-drop-down class="col-md-6" label="Marital Status" [data]="maritalStatuses" placeholder="Select Marital Status" formControlName="maritalStatus"></app-admin-drop-down>
                    <app-admin-general-input class="col-md-6" label="Number of Children" placeholder="Enter number of children" formControlName="childrenCount"></app-admin-general-input>
                    <app-admin-upload-file *ngIf="!isReadOnly" (FilesChenged)="OnFileChange($event)" [ImportedFiles]="ImportedFiles"></app-admin-upload-file>
                    <app-admin-slider-image *ngIf="!isReadOnly" (RefreshImage)="RefreshImageData($event)" [Images]="ImportedFiles"></app-admin-slider-image>
                </div>
            </div>
        </div>

        <!-- Removed steps: Admission and Surgical sections are not shown in create -->
    </form>

    <!-- Save only -->
    <div class="form-navigation" *ngIf="!isReadOnly">
        <button class="btn btn-success" (click)="savePatient()" [disabled]="BtnDisabled">
            <i class="fas fa-save"></i> Save
        </button>
    </div>
</div>
