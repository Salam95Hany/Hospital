<div class="patient-create-container">
  <div class="patient-create-header">
    <h2 class="patient-create-title">Add New Patient</h2>
    <button class="btn btn-outline-secondary" (click)="navigateBack()">
      <i class="fas fa-arrow-left"></i> Back to List
    </button>
  </div>

  <!-- Steps Progress Bar -->
  <div class="steps-container">
    <div class="steps-progress">
      <div class="progress-bar" [style.width.%]="((currentStep - 1) / (steps.length - 1)) * 100"></div>
    </div>
    <div class="steps-list">
      <div *ngFor="let step of steps; let i = index"
           class="step-item"
           [class.active]="currentStep === i + 1"
           [class.completed]="step.isCompleted">
        <div class="step-number">{{ i + 1 }}</div>
        <div class="step-title">{{ step.title }}</div>
      </div>
    </div>
  </div>

  <!-- Form Steps -->
<form #patientForm="ngForm" (ngSubmit)="savePatient()">
    <!-- Step 1: Patient Information -->
    <div *ngIf="currentStep === 1" class="step-content">
      <h3 class="step-heading">Patient Information</h3>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name <span class="required">*</span></label>
          <input [(ngModel)]="patientData.patient.name" name="name" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Birth Date</label>
          <input type="date" [(ngModel)]="patientData.patient.birthDate" name="birthDate" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Age</label>
          <input type="number" [(ngModel)]="patientData.patient.age" name="age" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Gender</label>
          <select [(ngModel)]="patientData.patient.gender" name="gender" class="form-select">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">National ID</label>
          <input [(ngModel)]="patientData.patient.nationalId" name="nationalId" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Address</label>
          <input [(ngModel)]="patientData.patient.address" name="address" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Governorate</label>
          <input [(ngModel)]="patientData.patient.governorate" name="governorate" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Occupation</label>
          <input [(ngModel)]="patientData.patient.occupation" name="occupation" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Marital Status</label>
          <input [(ngModel)]="patientData.patient.maritalStatus" name="maritalStatus" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Number of Children</label>
          <input [(ngModel)]="patientData.patient.childrenCount" name="childrenCount" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Internal Number</label>
          <input [(ngModel)]="patientData.patient.internalNumber" name="internalNumber" class="form-control" />
        </div>
      </div>
    </div>

    <!-- Step 2: Admission Details -->
    <div *ngIf="currentStep === 2" class="step-content">
      <h3 class="step-heading">Admission Details</h3>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Hospital File Number</label>
          <input [(ngModel)]="patientData.admission.hospitalFileNumber" name="hospitalFileNumber" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Admission Date</label>
          <input type="date" [(ngModel)]="patientData.admission.admissionDate" name="admissionDate" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Discharge Date</label>
          <input type="date" [(ngModel)]="patientData.admission.dischargeDate" name="dischargeDate" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Chief Complaint</label>
          <input [(ngModel)]="patientData.admission.chiefComplaint" name="chiefComplaint" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Duration</label>
          <input [(ngModel)]="patientData.admission.duration" name="duration" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Course</label>
          <input [(ngModel)]="patientData.admission.course" name="course" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">HPI</label>
          <textarea [(ngModel)]="patientData.admission.hpi" name="hpi" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Current Medications</label>
          <textarea [(ngModel)]="patientData.admission.currentMedications" name="currentMedications" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Past History</label>
          <textarea [(ngModel)]="patientData.admission.pastHistory" name="pastHistory" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Family History</label>
          <textarea [(ngModel)]="patientData.admission.familyHistory" name="familyHistory" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Comorbidities</label>
          <input [(ngModel)]="patientData.admission.comorbidities" name="comorbidities" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">BMI</label>
          <input [(ngModel)]="patientData.admission.bmi" name="bmi" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Temperature</label>
          <input type="number" [(ngModel)]="patientData.admission.temperature" name="temperature" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Pulse</label>
          <input type="number" [(ngModel)]="patientData.admission.pulse" name="pulse" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Blood Pressure</label>
          <input [(ngModel)]="patientData.admission.bloodPressure" name="bloodPressure" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">General Examination</label>
          <textarea [(ngModel)]="patientData.admission.generalExamination" name="generalExamination" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Abdominal Examination</label>
          <textarea [(ngModel)]="patientData.admission.abdominalExamination" name="abdominalExamination" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Genital Examination</label>
          <textarea [(ngModel)]="patientData.admission.genitalExamination" name="genitalExamination" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">DRE/Vaginal Examination</label>
          <textarea [(ngModel)]="patientData.admission.dreVaginalExamination" name="dreVaginalExamination" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Lab Results</label>
          <textarea [(ngModel)]="patientData.admission.labResults" name="labResults" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Imaging Results</label>
          <textarea [(ngModel)]="patientData.admission.imagingResults" name="imagingResults" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Provisional Diagnosis</label>
          <input [(ngModel)]="patientData.admission.provisionalDiagnosis" name="provisionalDiagnosis" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Medical Decision</label>
          <input [(ngModel)]="patientData.admission.medicalDecision" name="medicalDecision" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Scheduled Date for Intervention/Procedure</label>
          <input type="date" [(ngModel)]="patientData.admission.scheduledDate" name="scheduledDate" class="form-control" />
        </div>
      </div>
    </div>

    <!-- Step 3: Surgical Intervention -->
    <div *ngIf="currentStep === 3" class="step-content">
      <h3 class="step-heading">Surgical Intervention</h3>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Date of Intervention</label>
          <input type="date" [(ngModel)]="patientData.surgicalIntervention.interventionDate" name="interventionDate" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Theater</label>
          <input [(ngModel)]="patientData.surgicalIntervention.theater" name="theater" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Main Surgeon</label>
          <input [(ngModel)]="patientData.surgicalIntervention.mainSurgeon" name="mainSurgeon" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Assistants</label>
          <input [(ngModel)]="patientData.surgicalIntervention.assistants" name="assistants" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Resident</label>
          <input [(ngModel)]="patientData.surgicalIntervention.resident" name="resident" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Anesthesia</label>
          <input [(ngModel)]="patientData.surgicalIntervention.anesthesia" name="anesthesia" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">Intervention</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.intervention" name="intervention" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Details of Intervention</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.interventionDetails" name="interventionDetails" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Tubes Fixed</label>
          <input [(ngModel)]="patientData.surgicalIntervention.tubesFixed" name="tubesFixed" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <input [(ngModel)]="patientData.surgicalIntervention.category" name="category" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Approach</label>
          <input [(ngModel)]="patientData.surgicalIntervention.approach" name="approach" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Organ</label>
          <input [(ngModel)]="patientData.surgicalIntervention.organ" name="organ" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">Intra-operative Course</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.intraOperativeCourse" name="intraOperativeCourse" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Intra-op Adverse Events</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.intraOpAdverseEvents" name="intraOpAdverseEvents" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Blood Transfusion (Units)</label>
          <input type="number" [(ngModel)]="patientData.surgicalIntervention.bloodTransfusionUnits" name="bloodTransfusionUnits" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">Post-op Recommendations</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.postOpRecommendations" name="postOpRecommendations" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Post-op Course (Day 0-1)</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.postOpDay0_1" name="postOpDay0_1" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Post-op Course (Day 2-5)</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.postOpDay2_5" name="postOpDay2_5" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Post-op Course (Day >5)</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.postOpDayOver5" name="postOpDayOver5" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Post-op Adverse Events</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.postOpAdverseEvents" name="postOpAdverseEvents" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Discharge Date</label>
          <input type="date" [(ngModel)]="patientData.surgicalIntervention.dischargeDate" name="dischargeDate" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">Final Diagnosis</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.finalDiagnosis" name="finalDiagnosis" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Discharge Instructions</label>
          <textarea [(ngModel)]="patientData.surgicalIntervention.dischargeInstructions" name="dischargeInstructions" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Follow-up Doctor</label>
          <input [(ngModel)]="patientData.surgicalIntervention.followUpDoctor" name="followUpDoctor" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Follow-up Doctor Phone</label>
          <input [(ngModel)]="patientData.surgicalIntervention.followUpDoctorPhone" name="followUpDoctorPhone" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Follow-up Appointment</label>
          <input type="date" [(ngModel)]="patientData.surgicalIntervention.followUpAppointment" name="followUpAppointment" class="form-control" />
        </div>
      </div>
    </div>

    <!-- Step 4: Follow-Up -->
    <div *ngIf="currentStep === 4" class="step-content">
      <h3 class="step-heading">Follow-Up</h3>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Follow-up Date <span class="required">*</span></label>
          <input type="date" [(ngModel)]="patientData.followUp.followUpDate" name="followUpDate" class="form-control" required />
        </div>
        <div class="col-12">
          <label class="form-label">Patient Remarks</label>
          <textarea [(ngModel)]="patientData.followUp.patientRemarks" name="patientRemarks" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Details of Patient Remarks</label>
          <textarea [(ngModel)]="patientData.followUp.patientRemarksDetails" name="patientRemarksDetails" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Examination Findings</label>
          <textarea [(ngModel)]="patientData.followUp.examinationFindings" name="examinationFindings" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Wound Status</label>
          <input [(ngModel)]="patientData.followUp.woundStatus" name="woundStatus" class="form-control" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Catheters</label>
          <input [(ngModel)]="patientData.followUp.catheters" name="catheters" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">Lab Results</label>
          <textarea [(ngModel)]="patientData.followUp.labResults" name="labResults" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Imaging Results</label>
          <textarea [(ngModel)]="patientData.followUp.imagingResults" name="imagingResults" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Image Path</label>
          <input [(ngModel)]="patientData.followUp.imagePath" name="imagePath" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">Advice</label>
          <textarea [(ngModel)]="patientData.followUp.advice" name="advice" class="form-control"></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">New Decision</label>
          <textarea [(ngModel)]="patientData.followUp.newDecision" name="newDecision" class="form-control"></textarea>
        </div>
        <div class="col-md-6">
          <label class="form-label">Next Follow-up Date</label>
          <input type="date" [(ngModel)]="patientData.followUp.nextFollowUpDate" name="nextFollowUpDate" class="form-control" />
        </div>
      </div>
    </div> 
  </form>

  <!-- Navigation Buttons -->
   <div class="form-navigation">
    <button *ngIf="currentStep > 1" class="btn btn-outline-primary" (click)="prevStep()">
      <i class="fas fa-arrow-left"></i> Previous
    </button>
    
    <button *ngIf="currentStep < steps.length" class="btn btn-primary" (click)="nextStep()">
      Next <i class="fas fa-arrow-right"></i>
    </button>
    
    <button *ngIf="currentStep === steps.length" class="btn btn-success" (click)="savePatient()">
      <i class="fas fa-save"></i> Save
    </button>
  </div>
</div>
