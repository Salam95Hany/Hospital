<div class="patients-container">
  <div class="patients-header">
    <h2 class="patients-title">المرضى</h2>
    <button class="btn btn-primary add-patient-btn" (click)="navigateToAddPatient()">
      <i class="fas fa-plus-circle"></i> اضافة مريض
    </button>
  </div>

  <div class="search-filter-container">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="بحث عن مريض..." [(ngModel)]="searchTerm" (input)="applyFilter()">
    </div>
  </div>

  <div class="patients-table-container">
    <table class="table patients-table">
      <thead>
        <tr>
          <th>رقم الملف</th>
          <th>الاسم</th>
          <th>رقم الهاتف</th>
          <th>تاريخ الميلاد</th>
          <th>فصيلة الدم</th>
          <th>تاريخ التسجيل</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let patient of filteredPatients">
          <td>{{ patient.fileNumber }}</td>
          <td>{{ patient.fullName }}</td>
          <td>{{ patient.phoneNumber }}</td>
          <td>{{ patient.birthDate | date:'dd/MM/yyyy' }}</td>
          <td>{{ patient.bloodType || 'غير محدد' }}</td>
          <td>{{ patient.createdAt | date:'dd/MM/yyyy' }}</td>
          <td class="actions-cell">
            <button class="btn btn-sm btn-info" (click)="viewPatient(patient.id)">
              <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-sm btn-warning" (click)="editPatient(patient.id)">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-danger" (click)="deletePatient(patient.id)">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="filteredPatients.length === 0">
          <td colspan="7" class="text-center">لا يوجد مرضى</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
