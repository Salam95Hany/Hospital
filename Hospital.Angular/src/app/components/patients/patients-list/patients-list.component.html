<div class="patients-container">
    <div class="patients-header">
        <div class="d-flex align-items-center flex-wrap gap-2">
            <button class="btn btn-primary add-patient-btn" (click)="navigateToAddPatient()" appRole [roles]="['SupperAdmin', 'Admin']">
                <i class="fas fa-plus-circle"></i> Add Patient
            </button>
            <button class="btn btn-primary add-patient-btn" (click)="isFilter = !isFilter" [attr.aria-expanded]="!isFilter">
                <i class="fas fa-filter"></i> {{ isFilter ? 'Show' : 'Hide' }} Filters
            </button>
        </div>
        <div>
            <app-admin-pagination (pageChanged)="OnPageChange($event)" [currentPage]="PagingFilter.currentpage" [pageSize]="PagingFilter.pagesize" [totalPages]="0" [totalCount]="TotalCount"></app-admin-pagination>
        </div>
    </div>
    <div class="px-3 py-2 bg-light border-bottom" #collapse="ngbCollapse" [(ngbCollapse)]="isFilter">
        <app-admin-filter [FilterList]="FilterList" (FilterChecked)="OnFilterChecked($event)"></app-admin-filter>
    </div>
    <div class="patients-table-container">
        <table class="table patients-table">
            <thead>
                <tr>
                    <th>Internal Number</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Governorate</th>
                    <th>Gender</th>
                    <th appRole [roles]="['SupperAdmin', 'Admin']">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let patient of filteredPatients">
                    <td>{{ patient.internalNumber }}</td>
                    <td>{{ patient.name }}</td>
                    <td>{{ patient.age }}</td>
                    <td>{{ patient.governorate }}</td>
                    <td>{{ patient.gender }}</td>
                    <td class="actions-cell" appRole [roles]="['SupperAdmin', 'Admin']">
                        <button class="btn btn-sm btn-info" title="View" (click)="openPatientInfo(patient.id)">
              <i class="fas fa-eye"></i>
            </button>

                        <button class="btn btn-sm btn-warning" (click)="OpenPatentCreateModal(PatientCreateModal,patient.id)">
              <i class="fas fa-edit"></i>
            </button>
                        <button class="btn btn-sm btn-danger" (click)="deletePatient(patient.id)">
              <i class="fas fa-trash"></i>
            </button>
                    </td>
                </tr>
                <tr *ngIf="filteredPatients.length === 0">
                    <td colspan="7" class="text-center">No patients found</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Side info panel -->
<div class="offcanvas-backdrop fade show" *ngIf="isInfoOpen" (click)="closePatientInfo()"></div>
<div class="offcanvas offcanvas-end show" tabindex="-1" *ngIf="isInfoOpen" style="visibility: visible;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Patient Info</h5>
    <button type="button" class="btn-close text-reset" aria-label="Close" (click)="closePatientInfo()"></button>
  </div>
  <div class="offcanvas-body">
    <app-patient-last-details [patientId]="selectedPatientId"></app-patient-last-details>
  </div>
  <div class="offcanvas-footer p-2 border-top text-end">
    <button class="btn btn-outline-secondary" (click)="closePatientInfo()">
      <i class="fas fa-times"></i> Close
    </button>
  </div>
</div>

<ng-template #PatientCreateModal let-modal>
    <app-paitent-data (RefreshData)="RefreshData($event)" [PatientId]="PatientId"></app-paitent-data>
</ng-template>

<ng-template #PatientCreateFullModal let-modal>
    <app-patient-create (RefreshData)="RefreshData($event)" [isModal]="true"></app-patient-create>
</ng-template>
