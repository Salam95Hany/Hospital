<div class="patients-container">
    <div class="patients-header">
        <div class="d-flex align-items-center flex-wrap gap-2">
            <button class="btn btn-primary add-patient-btn" (click)="navigateToAddPatient()">
                <i class="fas fa-plus-circle"></i> Add Patient
            </button>
            
        </div>
        <div>
            <app-admin-pagination (pageChanged)="OnPageChange($event)" [currentPage]="PagingFilter.currentpage" [pageSize]="PagingFilter.pagesize" [totalPages]="0" [totalCount]="TotalCount"></app-admin-pagination>
        </div>
    </div>
    <div class="px-3 py-2 bg-light border-bottom"  >
        <div class="search-filter-container">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search for a Code..." [(ngModel)]="searchTerm" (input)="applyFilter()">
    </div>
  </div>
    <div class="patients-table-container">
        <table class="table patients-table">
            <thead>
                <tr>
                    <th>Internal Number</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Governorate</th>
                    <th>Gender</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let patient of filteredPatients">
                    <td>{{ patient.internalNumber }}</td>
                    <td>{{ patient.name }}</td>
                    <td>{{ patient.age }}</td>
                    <td>{{ patient.governorate }}</td>
                    <td>{{ patient.gender }}</td>
                    <td class="actions-cell">
                        <button class="btn btn-sm btn-info" (click)="viewPatient(patient.id)">
              <i class="fas fa-eye"></i>
            </button>
                        <button class="btn btn-sm btn-warning" (click)="OpenPatentCreateModal(PatientCreateModal,patient.id)">
              <i class="fas fa-edit"></i>
            </button>
                        <button class="btn btn-sm btn-danger" (click)="deletePatient(patient.id)">
              <i class="fas fa-trash"></i>
            </button>
                    </td>
                </tr>
                <tr *ngIf="filteredPatients.length === 0">
                    <td colspan="7" class="text-center">No patients found</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<ng-template #PatientCreateModal let-modal>
    <app-paitent-data (RefreshData)="RefreshData($event)" [PatientId]="PatientId"></app-paitent-data>
</ng-template>
