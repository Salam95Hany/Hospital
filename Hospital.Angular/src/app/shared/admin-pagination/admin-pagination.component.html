<div class="pagination-container d-flex align-items-center justify-content-end flex-wrap">
    <span class="me-2">
    <span class="CrossRef_2_Info me-1">Show {{showingStr}} Of</span>
    <span class="CrossRef_2_InfoTotal me-1">{{totalCount}}</span>
    </span>
    <div class="pull-right NewPaging">
        <pagination [(ngModel)]="currentPage" [boundaryLinks]="true" [totalItems]="totalCount" [maxSize]="maxSize" (pageChanged)="pageChangeEvevnt($event)" [itemsPerPage]="pageSize" previousText="Previous" nextText="Next" firstText="First" lastText="Last">
        </pagination>
    </div>
</div>
