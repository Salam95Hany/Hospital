<div class="z2-rowContainerv2">
    <div class="z2-row-labelv2">
        <div class="z2-row-label-textv2">{{ mainTitle }}</div>
    </div>
    <ng-container *ngIf="!selectedItem">
        <div class="input-wrapper">
            <div class="z2-input-group">
                <input type="text" class="z2-input-text" [formControl]="searchControl" (focus)="onInputFocus()" (blur)="onInputBlur()" placeholder="{{ inputPlaceholder }}" autocomplete="off" />
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256">
                    <path
                        d="M232.49,215.51,185,168a92.12,92.12,0,1,0-17,17l47.53,47.54a12,12,0,0,0,17-17ZM44,112a68,68,0,1,1,68,68A68.07,68.07,0,0,1,44,112Z" />
                </svg>
            </div>
            <div *ngIf="isResultsOpen" class="z2-mfr-list">
                <div *ngIf="!isAutoCompleteLoading && searchControl.value === '' && results.length === 0" class="no-results-message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256">
                        <path
                            d="M208,224a8,8,0,0,1-8,8A104.11,104.11,0,0,1,96,128V51.31L61.66,85.66A8,8,0,0,1,50.34,74.34l48-48a8,8,0,0,1,11.32,0l48,48a8,8,0,0,1-11.32,11.32L112,51.31V128a88.1,88.1,0,0,0,88,88A8,8,0,0,1,208,224Z" />
                    </svg>
                    <span>{{ searchDescripition }}</span>
                </div>
                <div *ngIf="!isAutoCompleteLoading && searchControl.value !== '' && results.length === 0" class="no-results-message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256">
                        <path
                            d="M208,224a8,8,0,0,1-8,8A104.11,104.11,0,0,1,96,128V51.31L61.66,85.66A8,8,0,0,1,50.34,74.34l48-48a8,8,0,0,1,11.32,0l48,48a8,8,0,0,1-11.32,11.32L112,51.31V128a88.1,88.1,0,0,0,88,88A8,8,0,0,1,208,224Z" />
                    </svg>
                    <span>No data found.</span>
                </div>
                <div *ngIf="isAutoCompleteLoading" class="loading-results">
                    <div class="z2-loading-spinner-large"></div>
                </div>
                <ng-container *ngIf="!isAutoCompleteLoading && results.length > 0">
                    <div *ngFor="let item of results" class="z2-mfr-item" (click)="selectItem(item)">
                        <div class="item-name">{{ item.name }}</div>
                    </div>
                </ng-container>
            </div>
        </div>
    </ng-container>
    <div *ngIf="selectedItem" class="selected-mfr-box">
        <svg class="supplier-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 256 256">
            <path
                d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v64h48A8,8,0,0,1,192,128Z" />
        </svg>

        <div class="selected-info">
            <div class="selected-name">{{ selectedItem.name }}</div>
        </div>

        <button class="selected-mfr-remove-button" (click)="removeSelected()" aria-label="Remove selected supplier">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256">
                <path
                    d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z" />
            </svg>
        </button>
    </div>
</div>
