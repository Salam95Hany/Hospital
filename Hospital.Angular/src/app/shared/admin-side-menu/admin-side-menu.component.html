<aside id="admin-side-menu" [class.collapse-side-menu]="isCollapsing">
  <div class="admin-side-menu-content h-100">
    <div class="hospital-brand"></div>
    <div class="admin-side-menu-user">
      <div class="side-menu-user-info d-flex flex-column gap-2">
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-user-md"></i>
          <div class="fw-bold side-menu-text">{{UserModel?.userName}}</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-calendar-alt"></i>
          <div class="fw-bold side-menu-text">{{UserModel?.loginDateAr}}</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-clock"></i>
          <div class="fw-bold side-menu-text">{{UserModel?.loginTimeAr}}</div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-user-shield"></i>
          <div class="fw-bold side-menu-text">{{RoleName}}</div>
        </div>
      </div>
    </div>
    <div class="admin-side-menu-list">
      <ul class="side-menu-list list-unstyled p-0 m-0">
        <li class="side-menu-list-item">
          <a class="side-menu-list-link" routerLink="/dashboard" routerLinkActive="active">
            <i class="fas fa-hospital"></i>
            <span class="side-menu-text">لوحة التحكم</span>
          </a>
        </li>
      </ul>
      <div>
        <div class="side-menu-list-title side-menu-text">إدارة المستشفى</div>
        <ul class="side-menu-list list-unstyled p-0 m-0">
          <li class="side-menu-list-item cursor-pointer">
            <a class="side-menu-list-link with-sub-menu expanded" [class.expanded]="isCollapsed_1" (click)="collapse.toggle()" [attr.aria-expanded]="!isCollapsed_1">
              <i class="fas fa-procedures"></i>
              <span class="side-menu-text">إدارة المرضى</span>
            </a>
          </li>
          <ul class="list-unstyled m-0 menu-list-collapsed" #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed_1">
            <li>
              <a class="side-menu-list-link sub-link" routerLink="/patients" routerLinkActive="active">
                <i class="fas fa-users"></i>
                <span class="side-menu-text">المرضى</span>
              </a>
            </li>
            <li>
              <a class="side-menu-list-link sub-link" routerLink="/doctors" routerLinkActive="active">
                <i class="fas fa-user-md"></i>
                <span class="side-menu-text">الأطباء</span>
              </a>
            </li>
            <li>
              <a class="side-menu-list-link sub-link" routerLink="/appointments" routerLinkActive="active">
                <i class="fas fa-calendar-check"></i>
                <span class="side-menu-text">المواعيد</span>
              </a>
            </li>
            <li>
              <a class="side-menu-list-link sub-link" routerLink="/departments" routerLinkActive="active">
                <i class="fas fa-building"></i>
                <span class="side-menu-text">الأقسام</span>
              </a>
            </li>
          </ul>
        </ul>
      </div>
      <div>
        <div class="side-menu-list-title side-menu-text">الإعدادات</div>
        <ul class="side-menu-list list-unstyled p-0 m-0">
          <li>
            <a class="side-menu-list-link" routerLink="/users" routerLinkActive="active">
              <i class="fas fa-user-cog"></i>
              <span class="side-menu-text">المستخدمين</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</aside>
<div class="admin-side-menu-overlay" [class.show]="isCollapsing" (click)="onCloseSidemenuFromOverlay()"></div>
