<aside id="admin-side-menu" [class.collapse-side-menu]="isCollapsing">
    <div class="admin-side-menu-content h-100">
        <!-- User Profile Card -->
        <div class="admin-side-menu-user">
            <div class="side-menu-user-info d-flex flex-column gap-2">
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-user-md"></i>
                    <div class="fw-bold side-menu-text">{{UserModel.userName}}</div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-calendar-alt"></i>
                    <div class="fw-bold side-menu-text">{{UserModel.loginDate | date}}</div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-clock"></i>
                    <div class="fw-bold side-menu-text">{{UserModel.loginTimeAr}}</div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-user-shield"></i>
                    <div class="fw-bold side-menu-text">{{UserModel.role}}</div>
                </div>
            </div>
        </div>
        <!-- Navigation Menu -->
        <div class="admin-side-menu-list">
            <!-- Dashboard Section -->
            <ul class="side-menu-list list-unstyled p-0 m-0">
                <li class="side-menu-list-item">
                    <a class="side-menu-list-link" routerLink="/admin/dashboard" routerLinkActive="active">
                        <i class="fas fa-chart-line"></i>
                        <span class="side-menu-text">Dashboard</span>
                    </a>
                </li>
            </ul>
            <!-- Hospital Management Section -->
            <div>
                <div class="side-menu-list-title side-menu-text">Hospital Management</div>
                <ul class="side-menu-list list-unstyled p-0 m-0">
                    <li class="side-menu-list-item">
                        <a class="side-menu-list-link with-sub-menu expanded cursor-pointer" [class.expanded]="isCollapsed_1" (click)="collapse.toggle()" [attr.aria-expanded]="!isCollapsed_1">
                            <i class="fas fa-procedures"></i>
                            <span class="side-menu-text">Patient Management</span>
                        </a>
                    </li>
                    <ul class="list-unstyled m-0 menu-list-collapsed" #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed_1">
                        <li appRole [roles]="['SupperAdmin', 'Admin','ReadOnly']">
                            <a class="side-menu-list-link sub-link" routerLink="/admin/patients" routerLinkActive="active">
                                <i class="fas fa-users"></i>
                                <span class="side-menu-text">Patients</span>
                            </a>
                        </li>
                        <li appRole [roles]="['SupperAdmin', 'Admin','ReadOnly']">
                            <a class="side-menu-list-link sub-link" routerLink="/admin/admissions" routerLinkActive="active">
                                <i class="fas fa-users"></i>
                                <span class="side-menu-text">Admissions</span>
                            </a>
                        </li>
                        <li appRole [roles]="['SupperAdmin', 'Admin','ReadOnly']">
                            <a class="side-menu-list-link sub-link" routerLink="/admin/surgical-intervention" routerLinkActive="active">
                                <i class="fas fa-users"></i>
                                <span class="side-menu-text">Surgical Interventions</span>
                            </a>
                        </li>
                        <li appRole [roles]="['SupperAdmin', 'Admin','FollowUpOnly','ReadOnly']">
                            <a class="side-menu-list-link sub-link" routerLink="/admin/follow-up" routerLinkActive="active">
                                <i class="fas fa-user-md"></i>
                                <span class="side-menu-text">Follow Up</span>
                            </a>
                        </li>
                    </ul>
                </ul>
            </div>
            <!-- Settings Section -->
            <div appRole [roles]="['SupperAdmin']">
                <div class="side-menu-list-title side-menu-text">Settings</div>
                <ul class="side-menu-list list-unstyled p-0 m-0">
                    <li class="side-menu-list-item">
                        <a class="side-menu-list-link with-sub-menu expanded cursor-pointer" [class.expanded]="isCollapsed_2" (click)="collapse2.toggle()" [attr.aria-expanded]="!isCollapsed_2">
                            <i class="fas fa-procedures"></i>
                            <span class="side-menu-text">Doctor Management</span>
                        </a>
                    </li>
                    <ul class="list-unstyled m-0 menu-list-collapsed" #collapse2="ngbCollapse" [(ngbCollapse)]="isCollapsed_2">
                        <li>
                            <a class="side-menu-list-link sub-link" routerLink="/admin/doctors" routerLinkActive="active">
                                <i class="fas fa-users"></i>
                                <span class="side-menu-text">Doctors</span>
                            </a>
                        </li>
                    </ul>
                </ul>
            </div>
        </div>
    </div>
</aside>
<div class="admin-side-menu-overlay" [class.show]="isCollapsing" (click)="onCloseSidemenuFromOverlay()"></div>
