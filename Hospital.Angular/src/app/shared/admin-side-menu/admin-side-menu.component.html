<aside id="admin-side-menu" [class.collapse-side-menu]="isCollapsing">
    <div class="admin-side-menu-content h-100">
      <div class="hospital-brand">
        <img src="assets/logo.png" alt="Hospital Logo" class="logo">
      </div>
      
      <!-- User Profile Card -->
      <div class="admin-side-menu-user">
        <div class="side-menu-user-info d-flex flex-column gap-2">
          <div class="d-flex align-items-center gap-2">
            <i class="fas fa-user-md"></i>
            <div class="fw-bold side-menu-text">{{UserModel?.userName}}</div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <i class="fas fa-calendar-alt"></i>
            <div class="fw-bold side-menu-text">{{UserModel?.loginDate}}</div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <i class="fas fa-clock"></i>
            <div class="fw-bold side-menu-text">{{UserModel?.loginTime}}</div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <i class="fas fa-user-shield"></i>
            <div class="fw-bold side-menu-text">{{RoleName}}</div>
          </div>
        </div>
      </div>
      
      <!-- Navigation Menu -->
      <div class="admin-side-menu-list">
        <!-- Dashboard Section -->
        <ul class="side-menu-list list-unstyled p-0 m-0">
          <li class="side-menu-list-item">
            <a class="side-menu-list-link" routerLink="/dashboard" routerLinkActive="active">
              <i class="fas fa-chart-line"></i>
              <span class="side-menu-text">Dashboard</span>
            </a>
          </li>
        </ul>
        
        <!-- Hospital Management Section -->
        <div>
          <div class="side-menu-list-title side-menu-text">Hospital Management</div>
          <ul class="side-menu-list list-unstyled p-0 m-0">
            <li class="side-menu-list-item cursor-pointer">
              <a class="side-menu-list-link with-sub-menu expanded" [class.expanded]="isCollapsed_1" (click)="collapse.toggle()" [attr.aria-expanded]="!isCollapsed_1">
                <i class="fas fa-procedures"></i>
                <span class="side-menu-text">Patient Management</span>
              </a>
            </li>
            <ul class="list-unstyled m-0 menu-list-collapsed" #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed_1">
              <li>
                <a class="side-menu-list-link sub-link" routerLink="/patients" routerLinkActive="active">
                  <i class="fas fa-users"></i>
                  <span class="side-menu-text">Patients</span>
                </a>
              </li>
              <li>
                <a class="side-menu-list-link sub-link" routerLink="/doctors" routerLinkActive="active">
                  <i class="fas fa-user-md"></i>
                  <span class="side-menu-text">Doctors</span>
                </a>
              </li>
              <li>
                <a class="side-menu-list-link sub-link" routerLink="/appointments" routerLinkActive="active">
                  <i class="fas fa-calendar-check"></i>
                  <span class="side-menu-text">Appointments</span>
                </a>
              </li>
  
              <li>
                <a class="side-menu-list-link sub-link" routerLink="/departments" routerLinkActive="active">
                  <i class="fas fa-building"></i>
                  <span class="side-menu-text">Departments</span>
                </a>
              </li>
            </ul>
          </ul>
        </div>
        
        <!-- Reports Section -->
        <div>
          <div class="side-menu-list-title side-menu-text">Reports</div>
          <ul class="side-menu-list list-unstyled p-0 m-0">
            <li class="side-menu-list-item">
              <a class="side-menu-list-link" routerLink="/reports" routerLinkActive="active">
                <i class="fas fa-chart-bar"></i>
                <span class="side-menu-text">Patient Reports</span>
              </a>
            </li>
            <li class="side-menu-list-item">
              <a class="side-menu-list-link" routerLink="/financial-reports" routerLinkActive="active">
                <i class="fas fa-money-bill-wave"></i>
                <span class="side-menu-text">Financial Reports</span>
              </a>
            </li>
          </ul>
        </div>
        
        <!-- Settings Section -->
        <div>
          <div class="side-menu-list-title side-menu-text">Settings</div>
          <ul class="side-menu-list list-unstyled p-0 m-0">
            <li class="side-menu-list-item">
              <a class="side-menu-list-link" routerLink="/users" routerLinkActive="active">
                <i class="fas fa-user-cog"></i>
                <span class="side-menu-text">Users</span>
              </a>
            </li>
            <li class="side-menu-list-item">
              <a class="side-menu-list-link" routerLink="/settings" routerLinkActive="active">
                <i class="fas fa-cogs"></i>
                <span class="side-menu-text">System Settings</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </aside>
  <div class="admin-side-menu-overlay" [class.show]="isCollapsing" (click)="onCloseSidemenuFromOverlay()"></div>
